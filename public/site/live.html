<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawback · try it live</title>
<meta name="description" content="Clawback finds the uptime credits your vendors owe you, writes the claim, and learns from every reply. Built with Cognee.">
<meta property="og:title" content="Clawback · try it live">
<meta property="og:description" content="Clawback finds the uptime credits your vendors owe you, writes the claim, and learns from every reply. Built with Cognee.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://clawback-two.vercel.app/live">
<meta property="og:image" content="https://clawback-two.vercel.app/site/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Clawback: your vendors owe you money. GitHub owes you $630.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://clawback-two.vercel.app/site/og.png">
<link rel="icon" href="/site/favicon.svg" type="image/svg+xml">
<style>html,body{margin:0;height:100%}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EEE2}
a{color:inherit}
.lv-btn{transition:transform 120ms cubic-bezier(.22,1,.36,1),background-color 150ms,box-shadow 150ms}
.lv-btn:active{transform:scale(.96)}
.lv-head:hover .lv-title{color:#22170F}
.lv-pick{transition:box-shadow 150ms cubic-bezier(.22,1,.36,1)}
@keyframes lvIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes lvRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lvGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes lvSlam{0%{opacity:0;transform:translateY(40px) rotate(-6deg)}60%{opacity:1;transform:translateY(-4px) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes lvPing{0%{box-shadow:0 0 0 0 rgba(255,106,31,.75)}100%{box-shadow:0 0 0 7px rgba(255,106,31,0)}}
@media (max-width: 980px){.lv-root{grid-template-columns:1fr !important;height:auto !important}.lv-main,.lv-aside{height:auto !important;overflow:visible !important}}
@media (max-width: 640px){.lv-ops{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

</head>
<body data-props='{"accent": "#FF6A1F", "theme": "light", "speed": "normal"}'>
<template id="tpl">

<div class="lv-root" style="display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100vh; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif">

  <main class="lv-main" style="height: 100vh; overflow-y: auto; padding: 22px 40px 80px; box-sizing: border-box; min-width: 0">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <svg width="22" height="14" viewBox="0 0 11 7" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 1h2v1H0zM1 0h1v1H1zM9 0h1v1H9zM9 1h2v1H9zM1 2h1v1H1zM9 2h1v1H9zM3 3h5v1H3zM2 4h7v2H2zM1 6h1v1H1zM3 6h1v1H3zM7 6h1v1H7zM9 6h1v1H9z" fill="#FF6A1F"></path><path d="M4 2h1v1H4zM6 2h1v1H6z" fill="{{c.ink}}"></path></svg>
        <span style="font-weight: 800; letter-spacing: -0.055em; font-size: 20px">Clawback</span>
      </a>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}">
        <span style="padding: 6px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px {{c.line}}">status pages: {{statusLabel}}</span>
        <span style="padding: 6px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px {{c.line}}">memory: {{memoryLabel}}</span>
        <button type="button" class="lv-btn" onClick="{{toggleTheme}}" aria-label="Switch to {{themeNext}} mode" style="all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}; color: {{c.ink}}">{{themeNext}} mode</button>
        <button type="button" class="lv-btn" onClick="{{reset}}" style="all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}; color: {{c.ink}}">Start over</button>
      </div>
    </header>

    <sc-if value="{{notice.on}}" hint-placeholder-val="{{ false }}">
      <div style="margin: 18px 0 0; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45; background: {{notice.bg}}; color: {{notice.color}}">{{notice.text}}</div>
    </sc-if>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin: 40px 0 28px">
      <div>
        <h1 style="margin: 0; font-size: clamp(34px, 3.6vw, 54px); line-height: 1; font-weight: 500; letter-spacing: -0.035em">try it live.</h1>
        <p style="margin: 4px 0 0; font-size: clamp(34px, 3.6vw, 54px); line-height: 1; font-weight: 500; letter-spacing: -0.035em; color: {{c.faint}}">one claim, start to finish.</p>
      </div>
      <div style="text-align: right">
        <div key="{{recoveredKey}}" style="font-size: clamp(34px, 3.6vw, 54px); line-height: 1; font-weight: 500; letter-spacing: -0.035em; color: {{recoveredColor}}; animation: {{recoveredAnim}}">{{recoveredText}}</div>
        <div style="margin-top: 6px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.faint}}">{{recoveredNote}}</div>
      </div>
    </div>

    <div style="margin: 0 0 22px; padding: 18px 20px; border-radius: 20px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap">
        <div style="font-size: 17px; font-weight: 500">How Clawback uses Cognee</div>
        <div style="font-size: 13px; color: {{c.muted}}">3 agents share 1 memory, split into 3 datasets with permissions. Every step calls one of these four.</div>
      </div>
      <div class="lv-ops" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px">
        <sc-for list="{{ops}}" as="op" hint-placeholder-count="4">
          <div class="lv-pick" style="padding: 12px 14px; border-radius: 14px; background: {{c.bg}}; box-shadow: {{op.ring}}">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: {{accent}}">{{op.name}}</span><span key="{{op.key}}" style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 22px; font-weight: 500; animation: {{op.anim}}">{{op.n}}</span></div>
            <div style="margin-top: 6px; font-size: 13px; line-height: 1.4; color: {{c.muted}}">{{op.what}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">

      <!-- promises -->
      <li ref="{{st.promises.ref}}" style="border-radius: 20px; background: {{st.promises.bg}}; box-shadow: inset 0 0 0 1px {{c.line}}; opacity: {{st.promises.opacity}}">
        <button type="button" class="lv-head" onClick="{{st.promises.toggle}}" style="all: unset; box-sizing: border-box; cursor: {{st.promises.cursor}}; display: flex; align-items: baseline; gap: 16px; width: 100%; padding: 16px 20px">
          <span style="width: 84px; flex: none; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{st.promises.nameColor}}">promises</span>
          <span class="lv-title" style="flex: 1; min-width: 0; font-size: 17px; font-weight: 500">Remember what each vendor promised</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}; text-align: right">{{st.promises.result}}</span>
        </button>
        <sc-if value="{{st.promises.open}}" hint-placeholder-val="{{ true }}">
          <div style="padding: 0 20px 20px 120px; animation: lvRise 260ms cubic-bezier(.22,1,.36,1) both">
            <sc-for list="{{vendors}}" as="v" hint-placeholder-count="3">
              <div style="display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid {{c.line}}">
                <div><div style="font-weight: 500">{{v.name}}</div><div style="font-size: 13px; color: {{c.faint}}">{{v.plan}}</div></div>
                <div style="min-width: 0"><div style="font-size: 15px">{{v.promise}}</div><a href="{{v.url}}" target="_blank" rel="noreferrer" style="font-size: 13px; color: {{c.muted}}">{{v.rule}}</a></div>
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{v.stateColor}}">{{v.state}}</span>
              </div>
            </sc-for>
            <div style="display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap">
              <button type="button" class="lv-btn" onClick="{{b.seed.onClick}}" style="all: unset; cursor: pointer; display: {{b.seed.display}}; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: {{c.ink}}; color: {{c.bg}}; font-size: 15px; font-weight: 500; opacity: {{b.seed.opacity}}">{{b.seed.label}}</button>
              <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.faint}}">remember() x 3, by the Auditor, into promises</span>
            </div>

            <div style="margin-top: 16px; border-radius: 14px; background: {{c.code}}; color: #F5EEE2; padding: 12px 16px; box-shadow: inset 0 0 0 1px {{c.codeRing}}">
              <div style="display: flex; justify-content: space-between; gap: 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6978A"><span>{{cog.promises.label}}</span><span>{{cog.promises.state}}</span></div>
              <sc-for list="{{cog.promises.calls}}" as="k" hint-placeholder-count="2">
                <div style="margin-top: 5px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.45; opacity: {{k.o}}"><span style="color: {{k.color}}">{{k.op}}</span> <span style="color: #CDBFB1">{{k.args}}</span></div>
              </sc-for>
              <div style="margin-top: 8px; font-size: 13px; line-height: 1.45; color: #E9DFD2">{{cog.promises.why}}</div>
            </div>
          </div>
        </sc-if>
      </li>

      <!-- audit -->
      <li ref="{{st.audit.ref}}" style="border-radius: 20px; background: {{st.audit.bg}}; box-shadow: inset 0 0 0 1px {{c.line}}; opacity: {{st.audit.opacity}}">
        <button type="button" class="lv-head" onClick="{{st.audit.toggle}}" style="all: unset; box-sizing: border-box; cursor: {{st.audit.cursor}}; display: flex; align-items: baseline; gap: 16px; width: 100%; padding: 16px 20px">
          <span style="width: 84px; flex: none; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{st.audit.nameColor}}">audit</span>
          <span class="lv-title" style="flex: 1; min-width: 0; font-size: 17px; font-weight: 500">Check their own status pages</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}; text-align: right">{{st.audit.result}}</span>
        </button>
        <sc-if value="{{st.audit.open}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 20px 20px 120px; animation: lvRise 260ms cubic-bezier(.22,1,.36,1) both">
            <sc-if value="{{audited}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px">
                <div style="padding: 16px; border-radius: 16px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}; animation: lvRise 360ms cubic-bezier(.22,1,.36,1) both">
                  <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 500">GitHub</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #C4321F">broken</span></div>
                  <div style="font-size: 13px; color: {{c.faint}}">Actions, Oct 1 to now</div>
                  <div style="margin-top: 10px; font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -0.03em; color: #C4321F">{{gh.uptime}}</div>
                  <div style="font-size: 13px; color: {{c.muted}}">{{gh.promise}}</div>
                  <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 4px; height: 56px; margin-top: 14px">
                    <sc-for list="{{bars}}" as="bar" hint-placeholder-count="12">
                      <span style="display: block; width: 9px; height: {{bar.h}}px; background: #C4321F; transform-origin: 50% 100%; animation: lvGrow 420ms cubic-bezier(.22,1,.36,1) {{bar.delay}}ms both"></span>
                    </sc-for>
                  </div>
                  <div style="margin-top: 6px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}">{{gh.minutesText}}</div>
                  <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 12px"><span style="font-size: 32px; font-weight: 500; letter-spacing: -0.03em; color: {{accent}}">{{gh.owed}}</span><span style="font-size: 13px; color: {{c.muted}}">{{gh.owedNote}}</span></div>
                  <button type="button" onClick="{{toggleIncidents}}" style="all: unset; cursor: pointer; margin-top: 10px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; color: {{c.ink}}">{{incidentsLabel}}</button>
                </div>
                <div style="padding: 16px; border-radius: 16px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}; animation: lvRise 360ms cubic-bezier(.22,1,.36,1) 80ms both">
                  <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 500">Twilio</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}">kept</span></div>
                  <div style="font-size: 13px; color: {{c.faint}}">APIs, November</div>
                  <div style="margin-top: 10px; font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -0.03em">{{tw.uptime}}</div>
                  <div style="font-size: 13px; color: {{c.muted}}">promised 99.95% a month</div>
                  <div style="margin-top: 12px; font-size: 32px; font-weight: 500; letter-spacing: -0.03em; color: {{c.faint}}">$0</div>
                  <div style="font-size: 13px; color: {{c.muted}}">{{tw.note}}</div>
                </div>
                <div style="padding: 16px; border-radius: 16px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}; animation: lvRise 360ms cubic-bezier(.22,1,.36,1) 160ms both">
                  <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 500">Cloudflare</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}">kept</span></div>
                  <div style="font-size: 13px; color: {{c.faint}}">Business, November</div>
                  <div style="margin-top: 10px; font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -0.03em">{{cf.uptime}}</div>
                  <div style="font-size: 13px; color: {{c.muted}}">promised 100% a month</div>
                  <div style="margin-top: 12px; font-size: 32px; font-weight: 500; letter-spacing: -0.03em; color: {{c.faint}}">$0</div>
                  <div style="font-size: 13px; color: {{c.muted}}">{{cf.note}}</div>
                </div>
              </div>
              <sc-if value="{{incidentsOpen}}" hint-placeholder-val="{{ false }}">
                <div style="margin-top: 12px; border-radius: 16px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}; padding: 6px 16px">
                  <sc-for list="{{incidents}}" as="inc" hint-placeholder-count="12">
                    <div style="display: grid; grid-template-columns: 112px 72px 64px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 8px 0; border-top: {{inc.border}}; font-size: 13px">
                      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}">{{inc.date}}</span>
                      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px">{{inc.min}} min</span>
                      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{inc.impactColor}}">{{inc.impact}}</span>
                      <a href="{{inc.url}}" target="_blank" rel="noreferrer" style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{inc.name}}</a>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </sc-if>
            <sc-if value="{{notAudited}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
                <button type="button" class="lv-btn" onClick="{{b.audit.onClick}}" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: {{c.ink}}; color: {{c.bg}}; font-size: 15px; font-weight: 500; opacity: {{b.audit.opacity}}">{{b.audit.label}}</button>
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.faint}}">githubstatus.com, status.twilio.com, cloudflarestatus.com</span>
              </div>
            </sc-if>

            <div style="margin-top: 16px; border-radius: 14px; background: {{c.code}}; color: #F5EEE2; padding: 12px 16px; box-shadow: inset 0 0 0 1px {{c.codeRing}}">
              <div style="display: flex; justify-content: space-between; gap: 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6978A"><span>{{cog.audit.label}}</span><span>{{cog.audit.state}}</span></div>
              <sc-for list="{{cog.audit.calls}}" as="k" hint-placeholder-count="2">
                <div style="margin-top: 5px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.45; opacity: {{k.o}}"><span style="color: {{k.color}}">{{k.op}}</span> <span style="color: #CDBFB1">{{k.args}}</span></div>
              </sc-for>
              <div style="margin-top: 8px; font-size: 13px; line-height: 1.45; color: #E9DFD2">{{cog.audit.why}}</div>
            </div>
          </div>
        </sc-if>
      </li>

      <!-- claim -->
      <li ref="{{st.claim.ref}}" style="border-radius: 20px; background: {{st.claim.bg}}; box-shadow: inset 0 0 0 1px {{c.line}}; opacity: {{st.claim.opacity}}">
        <button type="button" class="lv-head" onClick="{{st.claim.toggle}}" style="all: unset; box-sizing: border-box; cursor: {{st.claim.cursor}}; display: flex; align-items: baseline; gap: 16px; width: 100%; padding: 16px 20px">
          <span style="width: 84px; flex: none; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{st.claim.nameColor}}">claim</span>
          <span class="lv-title" style="flex: 1; min-width: 0; font-size: 17px; font-weight: 500">Write the claim and send it</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}; text-align: right">{{st.claim.result}}</span>
        </button>
        <sc-if value="{{st.claim.open}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 20px 20px 120px; animation: lvRise 260ms cubic-bezier(.22,1,.36,1) both">
            <sc-if value="{{drafted}}" hint-placeholder-val="{{ false }}">
              <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.muted}}; margin-bottom: 10px">{{recallNote}}</div>
              <div style="border-radius: 16px; background: {{c.sheet}}; box-shadow: inset 0 0 0 1px {{c.line}}; overflow: hidden; animation: lvRise 360ms cubic-bezier(.22,1,.36,1) both">
                <div style="display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; padding: 14px 18px; border-bottom: 1px solid {{c.line}}; font-size: 14px">
                  <span style="color: {{c.faint}}">To</span><span>GitHub Support</span>
                  <span style="color: {{c.faint}}">Subject</span><span style="font-weight: 500">{{emailSubject}}</span>
                </div>
                <div style="padding: 14px 18px; max-height: 260px; overflow-y: auto; font-size: 14px; line-height: 1.55; white-space: pre-wrap">{{emailBody}}</div>
              </div>
              <div style="display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap">
                <button type="button" class="lv-btn" onClick="{{b.send.onClick}}" style="all: unset; cursor: pointer; display: {{b.send.display}}; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: {{accent}}; color: #22170F; font-size: 15px; font-weight: 600; opacity: {{b.send.opacity}}">{{b.send.label}}</button>
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{sentColor}}">{{sentNote}}</span>
              </div>
            </sc-if>
            <sc-if value="{{notDrafted}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
                <button type="button" class="lv-btn" onClick="{{b.draft.onClick}}" style="all: unset; cursor: pointer; display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: {{c.ink}}; color: {{c.bg}}; font-size: 15px; font-weight: 500; opacity: {{b.draft.opacity}}">{{b.draft.label}}</button>
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{c.faint}}">the Claims Writer checks the playbook first</span>
              </div>
            </sc-if>

            <div style="margin-top: 16px; border-radius: 14px; background: {{c.code}}; color: #F5EEE2; padding: 12px 16px; box-shadow: inset 0 0 0 1px {{c.codeRing}}">
              <div style="display: flex; justify-content: space-between; gap: 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6978A"><span>{{cog.claim.label}}</span><span>{{cog.claim.state}}</span></div>
              <sc-for list="{{cog.claim.calls}}" as="k" hint-placeholder-count="2">
                <div style="margin-top: 5px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.45; opacity: {{k.o}}"><span style="color: {{k.color}}">{{k.op}}</span> <span style="color: #CDBFB1">{{k.args}}</span></div>
              </sc-for>
              <div style="margin-top: 8px; font-size: 13px; line-height: 1.45; color: #E9DFD2">{{cog.claim.why}}</div>
            </div>
          </div>
        </sc-if>
      </li>
